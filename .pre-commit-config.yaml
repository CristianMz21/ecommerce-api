repos:
  - repo: local
    hooks:
      - id: check-suppressions
        name: Detect code suppressions
        entry: python
        language: system
        pass_filenames: false
        args: ["scripts/check_suppressions.py", "--strict"]
        description: "Detect any suppressions in code and pyproject.toml"
        stages: [pre-commit]

      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]
        pass_filenames: true
        stages: [pre-commit]

      - id: ruff-check
        name: ruff check
        entry: ruff check
        language: system
        types: [python]
        pass_filenames: true
        args: ["--fix"]
        stages: [pre-commit]

      - id: mypy
        name: mypy type checking
        entry: mypy
        language: system
        types: [python]
        pass_filenames: false
        args: ["store/", "ecommerce_api/"]
        stages: [pre-commit]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
